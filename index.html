<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PERSONAL AI</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<canvas id="particles" aria-hidden="true"></canvas>
<div id="app">

<section id="s-welcome" class="screen active">
  <div class="halo"></div>
  <svg class="robot" viewBox="0 0 200 220" role="img" aria-label="Robot asistente">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#aab4d6"/></linearGradient>
    <radialGradient id="e"><stop offset="0" stop-color="#9fd0ff"/><stop offset="1" stop-color="#7a4dff"/></radialGradient></defs>
    <circle cx="100" cy="110" r="92" class="ring"/><circle cx="100" cy="110" r="80" class="ring r2"/>
    <ellipse cx="100" cy="170" rx="42" ry="36" fill="url(#g)"/>
    <rect x="48" y="52" width="104" height="78" rx="34" fill="url(#g)"/>
    <rect x="60" y="66" width="80" height="48" rx="22" fill="#0b0820"/>
    <circle class="eye" cx="82" cy="90" r="8" fill="url(#e)"/><circle class="eye" cx="118" cy="90" r="8" fill="url(#e)"/>
    <rect x="38" y="80" width="10" height="26" rx="5" fill="#c9d0ea"/><rect x="152" y="80" width="10" height="26" rx="5" fill="#c9d0ea"/>
    <circle cx="100" cy="42" r="5" fill="#7a4dff"/>
  </svg>
  <h1>PERSONAL AI</h1><p class="sub">Tu asistente inteligente personal</p>
  <button class="btn primary" data-go="home">Get Started</button>
  <p class="status"><i class="dot"></i><span id="status-text">Asistente listo</span></p>
</section>

<section id="s-home" class="screen">
  <header class="top"><svg class="mini" viewBox="0 0 40 40"><rect x="6" y="9" width="28" height="22" rx="10" fill="#e8ecff"/><circle cx="15" cy="20" r="3" fill="#7a4dff"/><circle cx="25" cy="20" r="3" fill="#7a4dff"/></svg>
    <div><b id="greeting">Hola, ¿en qué puedo ayudarte?</b><small><i class="dot"></i> <span id="mode-label">Modo demostración</span></small></div>
    <button class="icon" id="btn-account" aria-label="Perfil y configuración">⚙</button></header>
  <div class="cards">
    <button class="card" data-go="chat"><span class="ico">💬</span>Chat with AI</button>
    <button class="card" data-go="voice"><span class="ico">🎙</span>Talk with AI</button>
  </div>
  <h2>Topics</h2>
  <div class="chips" id="topics"></div>
  <h2>History <button class="link" id="see-all">See all</button></h2>
  <ul class="history" id="history"></ul>
</section>

<section id="s-chat" class="screen">
  <header class="top"><button class="icon" data-go="home" aria-label="Volver">‹</button><b>Chat</b><button class="icon" id="new-chat" aria-label="Nueva conversación">＋</button></header>
  <div id="banner" class="banner" hidden></div>
  <div id="messages" aria-live="polite"></div>
  <form id="composer"><textarea id="input" rows="1" maxlength="4000" placeholder="Escribe tu mensaje…" aria-label="Mensaje"></textarea>
  <button class="btn primary send" type="submit" aria-label="Enviar">➤</button></form>
</section>

<section id="s-voice" class="screen">
  <header class="top"><button class="icon" data-go="home" aria-label="Volver">‹</button><b id="voice-state">Listo</b><button class="icon" id="mute" aria-label="Silenciar voz">🔊</button></header>
  <div class="orb" id="orb"></div>
  <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <p id="voice-you" class="vtext"></p><p id="voice-ai" class="vtext ai"></p>
  <p class="tiny" id="voice-note">La voz se genera en tu dispositivo (síntesis del navegador).</p>
  <button class="mic" id="mic" aria-label="Hablar">🎙</button>
</section>

<dialog id="account"><form method="dialog"><h3>Cuenta</h3><p id="acc-info" class="tiny"></p>
  <input id="email" type="email" placeholder="Correo" autocomplete="email"><input id="pass" type="password" placeholder="Contraseña (mín. 8)" autocomplete="current-password">
  <div class="row"><button type="button" class="btn" id="login">Entrar</button><button type="button" class="btn" id="signup">Crear cuenta</button><button type="button" class="btn" id="logout">Salir</button></div>
  <p id="acc-msg" class="tiny"></p><button class="btn primary">Cerrar</button></form></dialog>
<dialog id="history-dialog"><form method="dialog"><h3>Historial de conversaciones</h3>
  <ul class="history" id="all-history"></ul><button class="btn primary">Cerrar</button></form></dialog>
</div>
<script src="app.js"></script>
</body></html>
